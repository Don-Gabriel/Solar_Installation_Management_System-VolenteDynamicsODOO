services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: solar
      POSTGRES_USER: solar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solar -d solar"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  app:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: 5432
      PGUSER: solar
      PGDATABASE: solar
      PGPASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/data/uploads
      COOKIE_SECURE: "false"
      APP_ORIGINS: http://127.0.0.1:3001,http://localhost:3001
      SEED_DEMO: "true"
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env.compose}
    volumes:
      - evidence_data:/app/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
volumes:
  postgres_data:
  evidence_data:
